name: Publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: npm-publish-pickupnewdate
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify semver tag format
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vMAJOR.MINOR.PATCH (e.g. v1.1.0)."
            exit 1
          fi

      - name: Verify tag points to master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/master

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v${TAG} does not match package.json version ${VERSION}."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm with trusted publishing support
        run: npm install -g npm@11

      - run: npm ci

      - name: Skip publish if version already on npm
        id: npm_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "pickupnewdate@${VERSION}" version 2>/dev/null; then
            echo "pickupnewdate@${VERSION} already on npm; skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run test:build
        if: steps.npm_version.outputs.skip != 'true'

      - name: Publish to npm
        if: steps.npm_version.outputs.skip != 'true'
        run: npm publish --provenance --access public

      - name: Publish troubleshooting
        if: failure() && steps.npm_version.outputs.skip != 'true'
        run: |
          echo "::error::npm publish failed. Configure Trusted publishing for peniakoff/pick-up-new-date and workflow publish.yml — see PUBLISHING.md and https://www.npmjs.com/package/pickupnewdate/access"
          echo "After fixing npm setup, re-push the tag:"
          echo "  git push origin :refs/tags/${GITHUB_REF_NAME}"
          echo "  git tag -f ${GITHUB_REF_NAME} ${GITHUB_SHA}"
          echo "  git push origin ${GITHUB_REF_NAME}"
